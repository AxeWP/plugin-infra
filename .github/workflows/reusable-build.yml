name: Build
on:
  workflow_call:
    inputs:
      php-version:
        required: true
        type: string
        description: 'The PHP version to use for the build.'
      plugin-slug:
        required: true
        type: string
        description: 'Plugin slug. `npm run plugin-zip` must create `<plugin-slug>.zip` in working-directory.'
      working-directory:
        required: false
        type: string
        default: '.'
        description: 'Plugin directory, relative to the repository root.'

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: ${{ inputs.php-version }}
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # v4.0.0
        with:
          working-directory: ${{ inputs.working-directory }}
          composer-options: '--no-dev --optimize-autoloader'

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install npm dependencies
        working-directory: .
        run: npm ci

      - name: Build plugin for release
        run: npm run build:prod

      - name: Create plugin zip
        run: npm run plugin-zip

      - name: Upload plugin zip artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-zip-${{ inputs.plugin-slug }}
          path: ${{ inputs.working-directory }}/${{ inputs.plugin-slug }}.zip
          if-no-files-found: error
