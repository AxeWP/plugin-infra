name: Run PHPUnit Tests

on:
  workflow_call:
    inputs:
      php-version:
        description: 'PHP version to use'
        required: true
        type: string
      wp-version:
        description: 'WordPress version (latest, trunk, or X.Y)'
        required: false
        type: string
        default: 'latest'
      coverage:
        description: 'Enable code coverage'
        required: false
        type: boolean
        default: false
      multisite:
        description: 'Run the multisite suite with `npm run test:php:multisite` (the plugin must define that script)'
        required: false
        type: boolean
        default: false
      working-directory:
        description: 'Plugin directory, relative to the repository root.'
        required: false
        type: string
        default: '.'
      plugin-slug:
        description: 'Appended to artifact names, so they are unique when called once per plugin.'
        required: false
        type: string
        default: ''

    secrets:
      CODECOV_TOKEN:
        description: 'Codecov upload token'
        required: false

permissions: {}

jobs:
  phpunit:
    name: PHPUnit (PHP ${{ inputs.php-version }}, WP ${{ inputs.wp-version }})${{ inputs.coverage && ' (coverage)' || '' }}${{ inputs.multisite && ' (multisite)' || '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      WP_ENV_PHP_VERSION: ${{ inputs.php-version }}
      WP_ENV_CORE: ${{ inputs.wp-version == 'trunk' && 'WordPress/WordPress' || inputs.wp-version == 'latest' && 'latest' || format('https://wordpress.org/wordpress-{0}.zip', inputs.wp-version) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: ${{ inputs.php-version }}
          coverage: ${{ inputs.coverage && 'xdebug' || 'none' }}

      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # v4.0.0
        with:
          working-directory: ${{ inputs.working-directory }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install npm dependencies
        working-directory: .
        run: npm ci

      - name: Build development assets
        run: npm run build:dev

      - name: Start the Docker testing environment
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: |
            cd "$WORKING_DIRECTORY" && npm run wp-env:test start --${{ inputs.coverage && ' --xdebug=coverage' || '' }}

      - name: Log versions
        run: |
          npm run wp-env:test -- run cli php -- -v
          npm run wp-env:test -- run cli wp core version

      - name: Run PHPUnit tests
        # `test:php:multisite` runs PHPUnit with WP_MULTISITE=1; wp-env itself has no multisite flag.
        run: npm run ${{ inputs.multisite && 'test:php:multisite' || 'test:php' }} ${{ !inputs.coverage && !inputs.multisite && '-- --no-coverage' || '' }}

      - name: Upload code coverage report
        if: ${{ inputs.coverage }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ inputs.working-directory }}/tests/_output/php-coverage.xml
          flags: unit
          fail_ci_if_error: false

      - name: Upload HTML coverage report as artifact
        if: ${{ inputs.coverage }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wp-code-coverage-${{ inputs.php-version }}-${{ inputs.wp-version }}${{ inputs.plugin-slug && format('-{0}', inputs.plugin-slug) || '' }}
          path: ${{ inputs.working-directory }}/tests/_output/html
          overwrite: true
