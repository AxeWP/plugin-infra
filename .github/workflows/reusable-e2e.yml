name: Run E2E Tests

on:
  workflow_call:
    inputs:
      php-version:
        description: 'PHP version to use'
        required: true
        type: string
      working-directory:
        description: 'Plugin directory, relative to the repository root.'
        required: false
        type: string
        default: '.'
      plugin-slug:
        description: 'Appended to artifact names, so they are unique when called once per plugin.'
        required: false
        type: string
        default: ''

permissions: {}

jobs:
  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: ${{ inputs.php-version }}
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # v4.0.0
        with:
          working-directory: ${{ inputs.working-directory }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install npm dependencies
        working-directory: .
        run: npm ci

      - name: Build plugin
        run: npm run build:prod

      - name: Start the Docker testing environment
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: cd "$WORKING_DIRECTORY" && npm run wp-env:test start

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload E2E test results as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report${{ inputs.plugin-slug && format('-{0}', inputs.plugin-slug) || '' }}
          path: ${{ inputs.working-directory }}/tests/_output
          retention-days: 2
          if-no-files-found: ignore
