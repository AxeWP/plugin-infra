name: Run JS Unit Tests

on:
  workflow_call:
    inputs:
      coverage:
        description: 'Enable code coverage'
        required: false
        type: boolean
        default: true
    secrets:
      CODECOV_TOKEN:
        description: 'Codecov upload token'
        required: false

permissions: {}

jobs:
  js-test:
    name: JS Unit Tests${{ inputs.coverage && ' (coverage)' || '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Run JS unit tests${{ inputs.coverage && ' with coverage' || '' }}
        run: npm run test:js${{ inputs.coverage && ':coverage' || '' }}

      - name: Upload code coverage report to Codecov
        if: ${{ inputs.coverage }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: tests/_output/js-coverage/lcov.info
          flags: js
          fail_ci_if_error: false

      - name: Upload HTML coverage report as artifact
        if: ${{ inputs.coverage }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: js-code-coverage
          path: tests/_output/js-coverage/lcov-report
          retention-days: 7
          if-no-files-found: ignore
